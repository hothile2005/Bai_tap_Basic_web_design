    <script>
       
        let sum= 0;
        let tongsochan = 0;
        for(var i=0; i<=5;i++){
            sum = sum +i;
            if(i%2===0){
              tongsochan = tongsochan +i;  
            }
        }
        console.log("Tong: " +sum)
        console.log("Tong so chan: "+tongsochan)
    </script>
